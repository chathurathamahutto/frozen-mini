<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SULA MD MINI BOT</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    /* Matrix Rain BG */
    #matrixCanvas {
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:black;
      z-index:0;
    }

    /* Glass Cards */
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      z-index: 2;
      animation: fadeUp 0.8s ease-out;
    }

    h1, h2 {
      font-size: 1.8rem;
      background: linear-gradient(to right, #00aaff, #00ddff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p { color:#cceeff; margin-bottom:1rem; }

    .input-group {
      display:flex;
      overflow:hidden;
      border-radius:10px;
      margin-top:1rem;
    }
    .input-group input {
      flex:1;
      padding:0.75rem;
      border:none;
      outline:none;
      font-size:1rem;
      color:#000;
    }
    .input-group button {
      background:#00aaff;
      border:none;
      font-weight:bold;
      padding:0 1rem;
      cursor:pointer;
      transition:0.3s;
      color:#fff;
    }
    .input-group button:hover { background:#0088cc; }

    #copy {
      cursor:pointer;
      display:inline-block;
      margin-top:10px;
      background:#111;
      padding:6px 14px;
      border-radius:8px;
      color:#00aaff;
      transition:0.3s;
    }
    #copy:hover { background:#222; }

    /* Toast */
    .toast {
      position:fixed;
      bottom:30px;
      left:50%;
      transform:translateX(-50%);
      padding:10px 20px;
      border-radius:10px;
      background:#00aaff;
      color:#000;
      font-weight:bold;
      z-index:9999;
      animation: fadeOut 2.5s ease forwards;
    }
    @keyframes fadeOut {
      0%,80% { opacity:1; }
      100% { opacity:0; }
    }

    @keyframes fadeUp {
      0%{opacity:0;transform:translateY(20px);}
      100%{opacity:1;transform:translateY(0);}
    }

    .cmd-btn {
      display: inline-block;
      margin: 4px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0,170,255,0.3);
      background: rgba(255,255,255,0.05);
      color: #00aaff;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(6px);
      text-align: left;
    }
    .cmd-btn:hover {
      background: rgba(0,170,255,0.1);
      box-shadow: 0 0 10px #00aaffaa;
      transform: translateY(-2px);
    }
    .cmd-desc {
      display:block;
      font-size:0.75rem;
      font-weight:normal;
      color:#cceeff;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>

  <div class="card">
    <h1 id="title"></h1>
    <img src="https://i.ibb.co/WNWsC9bN/SulaMd.png" class="preview-img" style="max-width:240px;border-radius:15px;box-shadow:0 0 15px #00aaff88;"/>
  </div>

  <div class="card">
    <p>Enter your WhatsApp number with country code</p>
    <div class="input-group">
      <input id="number" type="tel" placeholder="9476xxxxxxx"/>
      <button id="submit">Get Code</button>
    </div>
    <div id="loading" style="display:none;">⏳ Generating code...</div>
    <div id="pair"></div>
    <div id="clock"></div>
  </div>
<div class="card">
    <h2>🧩 Available Commands</h2>
    <input id="searchBox" type="text" placeholder="🔍 Search command..." style="width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:1px solid #00aaff44;background:rgba(255,255,255,0.07);color:white;"/>
    <div id="menuPreview"></div>
  </div>

  <script>
    // Typewriter Title
    const h1=document.getElementById("title");
    const intro="SULA MD MINI BOT"; let i=0;
    function typeEffect(){ if(i<intro.length){h1.innerHTML+=intro.charAt(i); i++; setTimeout(typeEffect,80);} }
    typeEffect();

    // Pair Code System
    const apiUrls = [
      "https://sula-md-mini-12-7dfa2a06935f.herokuapp.com",
      "https://sula-md-mini-11-551d5c24fab8.herokuapp.com"
    ];
    function getApiIndex(number){ return parseInt(localStorage.getItem("apiIndex_"+number))||0; }
    function setApiIndex(number,index){ localStorage.setItem("apiIndex_"+number,index); }

    document.getElementById("submit").addEventListener("click", fetchCode);
    async function fetchCode(){
      const number=document.getElementById("number").value.trim();
      const pair=document.getElementById("pair");
      const loading=document.getElementById("loading");
      if(!number){ showToast("⚠️ Please enter a number!",true); return; }
      let apiIndex=getApiIndex(number);
      const baseUrl=apiUrls[apiIndex % apiUrls.length];
      loading.style.display="block"; pair.innerHTML="";
      try{
        const apiUrl=${baseUrl}/code?number=${encodeURIComponent(number)};
        const proxy="https://api.allorigins.win/get?url="+encodeURIComponent(apiUrl);
        const res=await fetch(proxy);
        if(!res.ok) throw new Error("Invalid response");
        const data=await res.json();
        const parsed=JSON.parse(data.contents);
        if(parsed.code){
          pair.innerHTML=<div id="copy" onclick="copyCode('${parsed.code}')">📋 CODE: <b>${parsed.code}</b></div>;
          apiIndex=(apiIndex+1)%apiUrls.length;
          setApiIndex(number,apiIndex);
        }else{ pair.innerHTML="❌ No code found."; }
      }catch(e){ pair.innerHTML="🚫 Error fetching code"; }
      finally{ loading.style.display="none"; }
    }

    // Copy code
    function copyCode(code){
      navigator.clipboard.writeText(code);
      const el=document.getElementById("copy");
      el.innerHTML="✅ COPIED!";
      showToast("Code copied!");
      setTimeout(()=>{ el.innerHTML=📋 CODE: <b>${code}</b>;},1200);
    }

    function showToast(msg,isError=false){
      const toast=document.createElement("div");
      toast.textContent=msg;
      toast.className="toast";
      toast.style.background=isError?"#ff4c4c":"#00aaff";
      toast.style.color=isError?"#fff":"#000";
      document.body.appendChild(toast);
      setTimeout(()=>toast.remove(),2500);
    }

    // Clock
    setInterval(()=>{
      const now=new Date();
      let h=now.getHours();let m=String(now.getMinutes()).padStart(2,'0');let s=String(now.getSeconds()).padStart(2,'0');
      const ampm=h>=12?'PM':'AM'; h=h%12||12;
      document.getElementById("clock").textContent=🕒 ${h}:${m}:${s} ${ampm};
    },1000);

    // Commands
    const allCommands = [
      {cmd:"alive", desc:"Show bot status"},
      {cmd:"menu", desc:"Show bot menu"},
      {cmd:"ping", desc:"View bot speed"},
      {cmd:"help", desc:"Get help with commands"},
      {cmd:"owner", desc:"Show bot owner info"},
      {cmd:"sticker", desc:"Convert image/video to sticker"},
      {cmd:"song", desc:"Download a song by name"},
      {cmd:"video", desc:"Download a video by name"}
    ];
    const searchInput=document.getElementById("searchBox");
    const menuPreview=document.getElementById("menuPreview");
    function renderCommands(list){
      menuPreview.innerHTML=list.map(c=>
        <div class="cmd-btn">/${c.cmd}<span class="cmd-desc">${c.desc}</span></div>
).join("");
    }
    renderCommands(allCommands);
    searchInput.addEventListener("input",()=>{
      const q=searchInput.value.toLowerCase();
      const filtered=allCommands.filter(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q));
      renderCommands(filtered);
    });

    // Matrix Rain (Blue)
    (function(){
      const canvas=document.getElementById("matrixCanvas");
      const ctx=canvas.getContext("2d");
      function size(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
      size(); window.addEventListener("resize",size);
      const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const fontSize=14;
      let cols=Math.floor(canvas.width/fontSize);
      let drops=new Array(cols).fill(0);

      function draw(){
        ctx.fillStyle="rgba(0,0,0,.1)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#00aaff"; // BLUE COLOR
        ctx.font=fontSize+"px monospace";

        for(let i=0;i<drops.length;i++){
          const text=chars.charAt(Math.floor(Math.random()*chars.length));
          ctx.fillText(text,i*fontSize,drops[i]*fontSize);

          if(drops[i]*fontSize>canvas.height && Math.random()>0.975){ drops[i]=0; }
          drops[i]++;
        }
      }
      setInterval(draw,33);
    })();
  </script>
</body>
</html>
